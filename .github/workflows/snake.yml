name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ZainDev04
          outputs: |
            dist/github-snake.svg?color_snake=#6366F1&color_dots=#ebedf0,#c7d5f7,#8aa8f0,#4f74e0,#1e3a8a
            dist/github-snake-dark.svg?color_snake=#06B6D4&color_dots=#161b22,#1e293b,#1e3a8a,#2563eb,#06b6d4

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
